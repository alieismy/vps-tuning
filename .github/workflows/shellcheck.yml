name: shell-static-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check generated profiles and shell structure
        run: |
          bash tests/static-check.sh
          bash experiments/htb-aggregate/tests/static-check.sh

      - name: Check verified installer lifecycle
        run: |
          sudo bash tests/installer-check.sh
          sudo bash tests/rc18-check.sh
          sudo python3 -B -m unittest discover -s tests -p 'test_tcp_baseline_recovery.py'

      - name: Check temporary HTB with native tc and isolated traffic
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 jq build-essential
          # 3.16 的 application pacing 会忙等，占满 CPU；3.18 修复 #1741/#1743。
          mkdir -p .tmp/ci-iperf
          curl -fsSL https://github.com/esnet/iperf/releases/download/3.18/iperf-3.18.tar.gz \
            -o .tmp/ci-iperf/iperf-3.18.tar.gz
          echo 'c0618175514331e766522500e20c94bfb293b4424eb27d7207fb427b88d20bab  .tmp/ci-iperf/iperf-3.18.tar.gz' | sha256sum -c -
          tar -xzf .tmp/ci-iperf/iperf-3.18.tar.gz -C .tmp/ci-iperf
          (
            cd .tmp/ci-iperf/iperf-3.18
            ./configure --prefix=/usr/local --disable-shared > ../configure.log 2>&1 || { cat ../configure.log; exit 1; }
            make -j2 > ../make.log 2>&1 || { cat ../make.log; exit 1; }
            sudo make install > ../install.log 2>&1 || { cat ../install.log; exit 1; }
          )
          iperf3 --version
          sudo modprobe tcp_bbr || true
          sudo bash tests/temporary-htb-check.sh

      - name: ShellCheck 0.11.0
        run: |
          mkdir -p .tmp/ci-helpers
          for script in debian1*-vps-tuning.sh ubuntu*-vps-tuning.sh; do
            helper=".tmp/ci-helpers/${script}.helper"
            awk "/^  write_managed_file .*FQ_HELPER.*<<'EOF_HELPER'/ {inside=1; next} /^EOF_HELPER$/ {inside=0} inside" \
              "$script" >"$helper"
            test -s "$helper"
          done
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            -x \
            debian-vps-tuning.sh \
            debian12-1c512m-vps-tuning.sh \
            debian12-1c1g-vps-tuning.sh \
            debian12-1c2g-vps-tuning.sh \
            debian13-1c512m-vps-tuning.sh \
            debian13-1c1g-vps-tuning.sh \
            debian13-1c2g-vps-tuning.sh \
            debian12-adaptive-vps-tuning.sh \
            debian13-adaptive-vps-tuning.sh \
            ubuntu2404-adaptive-vps-tuning.sh \
            tcpquality-evidence.sh \
            dvt-traffic-budget.sh \
            dvt-migrate.sh \
            install.sh \
            dvt-probe.sh \
            dvt-measure-runtime.sh \
            dvt-htb.sh \
            experiments/htb-aggregate/experiment-plan.sh \
            experiments/htb-aggregate/htb-aggregate-experiment.sh \
            experiments/htb-aggregate/rate-sweep-plan.sh \
            experiments/htb-aggregate/rate-sweep-run.sh \
            experiments/htb-aggregate/rate-sweep-analyze.sh \
            tests/static-check.sh \
            tests/controller-check.sh \
            tests/installer-check.sh \
            tests/rc18-check.sh \
            tests/temporary-htb-check.sh \
            tests/platform-guest.sh \
            experiments/htb-aggregate/tests/static-check.sh \
            .tmp/ci-helpers/*.helper
